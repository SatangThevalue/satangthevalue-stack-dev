version: "3.8"

services:

  # ===================================================================
  # 1. CORE INFRASTRUCTURE (Traefik, Database, Cache)
  # ===================================================================

  # --- 1.1 Traefik (Reverse Proxy) ---
  # Service ที่เป็น "หน้าด่าน" รับ Traffic ทั้งหมดจากภายนอก
  traefik:
    image: "traefik:v3.0"
    container_name: "traefik"
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - TZ=${TZ}
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--api.dashboard=true"
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "8080:8080" # Traefik Dashboard (หากต้องการเข้าตรง)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/certs:/etc/traefik/certs:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"

  # --- 1.2 PostgreSQL (Database) ---
  # ฐานข้อมูลหลักที่ Service อื่นๆ (Infisical, Prefect) จะมาเชื่อมต่อ
  db:
    container_name: postgres-db
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
      # --- ตัวแปรสำหรับสคริปต์ init-user-db.sh ---
      - INFISICAL_POSTGRES_DB=${INFISICAL_POSTGRES_DB}
      - INFISICAL_POSTGRES_USER=${INFISICAL_POSTGRES_USER}
      - INFISICAL_POSTGRES_PASSWORD=${INFISICAL_POSTGRES_PASSWORD}
      - PREFECT_POSTGRES_USER=${PREFECT_POSTGRES_USER}
      - PREFECT_POSTGRES_PASSWORD=${PREFECT_POSTGRES_PASSWORD}
      - PREFECT_POSTGRES_DB=${PREFECT_POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/backups:/backups
      - ./infra/postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
    networks:
      - backend
    healthcheck:
      test: "pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10
    labels:
      - "traefik.enable=false" # ไม่เปิดให้เข้าจากภายนอก

  # --- 1.3 Redis (Cache / Message Broker) ---
  # ตัวกลางเก็บ Cache หรือส่งข้อความ (ใช้โดย Infisical และ Prefect)
  redis:
    container_name: infisical-redis
    image: redis:alpine
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    labels:
      - "traefik.enable=false" # ไม่เปิดให้เข้าจากภายนอก

  # ===================================================================
  # 2. DATABASE MANAGEMENT TOOLS
  # ===================================================================

  # --- 2.1 pgAdmin (Database Web UI) ---
  # หน้าเว็บสำหรับจัดการ PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - TZ=${TZ}
      - DOMAIN=${DOMAIN}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - pgadmin:/var/lib/pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=backend"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${DOMAIN}`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls=true"

  # --- 2.2 Database Backup Service ---
  # Service สำหรับ Backup ฐานข้อมูลอัตโนมัติ
  db-backup:
    container_name: postgres-db-backup
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      # ตั้งค่า POSTGRES_DB ให้เป็นค่าว่าง ("") 
      # เพื่อสั่งให้ image นี้ใช้ pg_dumpall (backup ทุกฐานข้อมูล)
      - POSTGRES_DB=""
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=${BACKUP_SCHEDULE}
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes:
      - ./infra/postgres/backups:/backups
    networks:
      - backend
    labels:
      - "traefik.enable=false"
    healthcheck:
      # คำสั่งที่ใช้ทดสอบ
      # curl --fail จะ exit 1 ทันทีถ้า HTTP status ไม่ใช่ 2xx
      test: ["CMD", "curl", "--fail", "http://db-backup:8080/status"]
      # ตรวจสอบทุก 5 นาที
      interval: 5m
      # รอผลลัพธ์ไม่เกิน 10 วินาที
      timeout: 10s
      # ลอง 3 ครั้งก่อนจะ mark ว่า unhealthy
      retries: 3
      # รอ 1 นาทีหลังจาก container เริ่ม ก่อนจะเริ่มเช็คครั้งแรก
      start_period: 1m

  # ===================================================================
  # 3. APPLICATION: Infisical (Secrets Management)
  # ===================================================================
  infisical:
    container_name: infisical
    image: infisical/infisical:latest
    restart: unless-stopped
    pull_policy: always
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - DB_CONNECTION_URI=${INFISICAL_DB_CONNECTION_URI} # ใช้ DB ของตัวเอง
      - REDIS_URL=redis://redis:6379
      - SITE_URL=https://infisical.${DOMAIN}
      - NODE_ENV=production
      - ALLOW_INTERNAL_IP_CONNECTIONS=true
      # ตัวแปรเหล่านี้ส่งให้ Infisical (เผื่อจำเป็น) แต่หลักๆ ใช้โดย init script
      - INFISICAL_POSTGRES_USER=${INFISICAL_POSTGRES_USER}
      - INFISICAL_POSTGRES_PASSWORD=${INFISICAL_POSTGRES_PASSWORD}
      - INFISICAL_POSTGRES_DB=${INFISICAL_POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=backend"
      - "traefik.http.services.infisical-backend.loadbalancer.server.port=8080"
      - "traefik.http.routers.infisical.rule=Host(`infisical.${DOMAIN}`)"
      - "traefik.http.routers.infisical.entrypoints=websecure"
      - "traefik.http.routers.infisical.tls=true"

  # ===================================================================
  # 4. APPLICATION: Prefect (Workflow Orchestration)
  # ===================================================================

  # --- 4.1 Prefect Database Migration ---
  # Service นี้จะทำงานครั้งเดียวเพื่อสร้างตารางใน DB ให้ Prefect
  prefect-migrate:
    container_name: prefect-migrate
    image: prefecthq/prefect:3-latest
    depends_on:
      db:
        condition: service_healthy
    command: prefect server database upgrade -y
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=${PREFECT_API_DATABASE_CONNECTION_URL}
      - PREFECT_API_DATABASE_TIMEOUT=600
    networks:
      - backend
    labels:
      - "traefik.enable=false"

  # --- 4.2 Prefect API & UI Server ---
  # Service หลักของ Prefect ที่ให้บริการทั้ง API และหน้าเว็บ UI
  prefect-api:
    container_name: prefect-api
    image: prefecthq/prefect:3-latest
    depends_on:
      prefect-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: prefect server start --host 0.0.0.0 --no-services
    environment:
      - PREFECT_UI_URL=${PREFECT_UI_URL}
      - PREFECT_UI_API_URL=${PREFECT_UI_API_URL}
      - PREFECT_UI_SERVE_BASE=${PREFECT_UI_SERVE_BASE}
      - PREFECT_API_DATABASE_CONNECTION_URL=${PREFECT_API_DATABASE_CONNECTION_URL}
      - PREFECT_API_DATABASE_MIGRATE_ON_START=${PREFECT_API_DATABASE_MIGRATE_ON_START}
      - PREFECT_MESSAGING_BROKER=${PREFECT_MESSAGING_BROKER}
      - PREFECT_MESSAGING_CACHE=${PREFECT_MESSAGING_CACHE}
      - PREFECT_SERVER_EVENTS_CAUSAL_ORDERING=${PREFECT_SERVER_EVENTS_CAUSAL_ORDERING}
      - PREFECT_SERVER_CONCURRENCY_LEASE_STORAGE=${PREFECT_SERVER_CONCURRENCY_LEASE_STORAGE}
      - PREFECT_REDIS_MESSAGING_HOST=${PREFECT_REDIS_MESSAGING_HOST}
      # [FIXED] แก้ไข Typo จาก Mpgadmin เป็น MESSAGING
      - PREFECT_REDIS_MESSAGING_PORT=${PREFECT_REDIS_MESSAGING_PORT}
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=backend"
      - "traefik.http.services.prefect-svc.loadbalancer.server.port=4200"
      - "traefik.http.routers.prefect.rule=Host(`prefect.${DOMAIN}`)"
      - "traefik.http.routers.prefect.entrypoints=websecure"
      - "traefik.http.routers.prefect.tls=true"
      - "traefik.http.routers.prefect.service=prefect-svc"

  # --- 4.3 Prefect Background Services ---
  # Service ที่รันงานเบื้องหลัง เช่น Agent, Scheduler ฯลฯ
  prefect-background:
    container_name: prefect-background
    image: prefecthq/prefect:3-latest
    depends_on:
      prefect-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: prefect server services start
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=${PREFECT_API_DATABASE_CONNECTION_URL}
      - PREFECT_API_DATABASE_MIGRATE_ON_START=${PREFECT_API_DATABASE_MIGRATE_ON_START}
      - PREFECT_MESSAGING_BROKER=${PREFECT_MESSAGING_BROKER}
      - PREFECT_MESSAGING_CACHE=${PREFECT_MESSAGING_CACHE}
      - PREFECT_SERVER_EVENTS_CAUSAL_ORDERING=${PREFECT_SERVER_EVENTS_CAUSAL_ORDERING}
      - PREFECT_SERVER_CONCURRENCY_LEASE_STORAGE=${PREFECT_SERVER_CONCURRENCY_LEASE_STORAGE}
      - PREFECT_REDIS_MESSAGING_HOST=${PREFECT_REDIS_MESSAGING_HOST}
      - PREFECT_REDIS_MESSAGING_PORT=${PREFECT_REDIS_MESSAGING_PORT}
    networks:
      - backend
    labels:
      - "traefik.enable=false"

  # ===================================================================
  # 5. UTILITIES (Testing)
  # ===================================================================

  # --- 5.1 Whoami (Test Service) ---
  # Service ง่ายๆ สำหรับทดสอบว่า Traefik ทำงานถูกต้องหรือไม่
  whoami:
    image: "traefik/whoami"
    container_name: "whoami-app"
    restart: unless-stopped
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=backend"
      - "traefik.http.services.whoami-app.loadbalancer.server.port=80"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN}`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"

# ===================================================================
# TOP-LEVEL DEFINITIONS (Volumes & Networks)
# ===================================================================

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  pgadmin:
    driver: local

networks:
  backend:
    name: backend