services:
# --------------------------------------------------------------------------------
  # 2. ChromaDB (Vector Database)
  # --------------------------------------------------------------------------------
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: always
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMOUS_TELEMETRY=FALSE
    volumes:
      - ./infra/chroma:/chroma/chroma
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=backend"
      - "traefik.http.routers.chroma.rule=Host(`chroma.${DOMAIN}`)"
      - "traefik.http.routers.chroma.entrypoints=websecure"
      - "traefik.http.routers.chroma.tls=true"
      - "traefik.http.services.chroma.loadbalancer.server.port=8000"
      # หมายเหตุ: Chroma ไม่มี Auth ในตัว ควรเพิ่ม Middleware BasicAuth ใน Traefik หากเปิด Public
networks:
  frontend:
    external: true
  backend:
    external: true