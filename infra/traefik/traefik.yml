# traefik.yml (Static Configuration)
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# --- EntryPoints (ประตูทางเข้า) ---
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}

# --- Providers (ตัวบอก Traefik ว่า Service อยู่ที่ไหน) ---
providers:
  docker:
    exposedByDefault: false
    network: backend
  file:
    filename: /etc/traefik/config.yml
    watch: true

# --- API & Dashboard ---
api:
  dashboard: true
  insecure: true

# --- LOGS ---
log:
  level: INFO
  format: json
  filePath: /var/log/traefik/traefik.log