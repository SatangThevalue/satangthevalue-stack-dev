# traefik.yml (Static Configuration)
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# --- EntryPoints (ประตูทางเข้า) ---
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}

# --- Providers (ตัวบอก Traefik ว่า Service อยู่ที่ไหน) ---
providers:
  docker:
    exposedByDefault: false
    network: backend
  file:
    filename: /etc/traefik/config.yml
    watch: true

# --- API & Dashboard ---
api:
  dashboard: true
  insecure: true

# --- LOGS ---
log:
  level: DEBUG
  format: json
  #filePath: /var/log/traefik/traefik.log
# 2. Access Log: บันทึกทุก HTTP Request (ใครเข้าเว็บไหน เมื่อไหร่) <--- ส่วนที่เพิ่มใหม่
accessLog:
  format: json
  # filePath: /var/log/traefik/access.log
  bufferingSize: 100 # เขียนลง disk เมื่อครบ 100 lines (ลด IO load)
  filters:
    statusCodes:
      - "200-299"
      - "400-599"
    retryAttempts: true
    minDuration: "10ms"